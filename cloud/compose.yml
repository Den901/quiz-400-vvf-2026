services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz400
      POSTGRES_USER: quiz400
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurare POSTGRES_PASSWORD nel file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz400 -d quiz400"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    environment:
      Q400_ENV: production
      DATABASE_URL: postgresql+psycopg://quiz400:${POSTGRES_PASSWORD}@database:5432/quiz400
      APP_SECRET: ${APP_SECRET:?Configurare APP_SECRET nel file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Amministratore}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configurare ADMIN_PASSWORD nel file .env}
    depends_on:
      database:
        condition: service_healthy
    expose: ["8000"]
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
