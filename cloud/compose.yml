services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz400
      POSTGRES_USER: quiz400
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurare POSTGRES_PASSWORD nel file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz400 -d quiz400"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    environment:
      Q400_ENV: production
      DATABASE_URL: postgresql+psycopg://quiz400:${POSTGRES_PASSWORD}@database:5432/quiz400
      APP_SECRET: ${APP_SECRET:?Configurare APP_SECRET nel file .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Amministratore}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configurare ADMIN_PASSWORD nel file .env}
      PUBLIC_HTTP_PORT: ${HTTP_PORT:-80}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      PUBLIC_APP_PORT: ${APP_PORT:-8088}
      PUBLIC_APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-127.0.0.1}
      PUBLIC_PROXY_MODE: ${PROXY_MODE:-bundled}
      PORT_CONTROL_DIR: ${PORT_CONTROL_CONTAINER_DIR:-}
    depends_on:
      database:
        condition: service_healthy
    expose: ["8000"]
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:8000"
    volumes:
      - ./control:/srv/quiz400-control
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    profiles: ["bundled-proxy"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
